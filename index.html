<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>💎 聖獸命運聖殿：全功能大師版</title>
    <style>
        :root {
            --ur: linear-gradient(45deg, #ff0000, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff);
            --ssr: #ffd700; --sr: #a855f7; --s: #22c55e; --r: #3b82f6; --n: #94a3b8;
            --item: #0ea5e9;
        }

        body {
            margin: 0; font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #000; color: white; overflow: hidden; height: 100vh;
        }

        /* 背景 */
        .vortex {
            position: fixed; top: 50%; left: 50%; width: 250vw; height: 250vh;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            transform: translate(-50%, -50%); z-index: -2; animation: rotate 60s linear infinite;
        }
        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* 導覽列 */
        .top-nav {
            position: fixed; top: 0; width: 100%; padding: 10px 30px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            border-bottom: 2px solid rgba(255,255,255,0.1); box-sizing: border-box;
        }

        .view { position: absolute; top: 70px; bottom: 0; width: 100%; display: none; padding: 20px; box-sizing: border-box; }
        .view.active { display: flex; }

        /* --- 召喚介面 --- */
        #draw-view, #custom-view { flex-direction: column; align-items: center; }
        .summon-stage { 
            flex: 1; width: 100%; display: flex; flex-wrap: wrap; 
            justify-content: center; align-items: center; gap: 20px; overflow-y: auto; padding: 20px;
        }
        
        /* 卡片尺寸縮小優化 */
        .big-card { width: 220px; height: 340px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1); }
        .big-card.flipped { transform: rotateY(180deg) scale(1.05); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; border: 5px solid #fff; box-sizing: border-box; }
        .card-back { background: #111; display: flex; justify-content: center; align-items: center; border-color: #444; }
        .card-back::after { content: "⚡"; font-size: 6rem; color: #222; }

        .card-front { transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; padding: 20px; justify-content: space-around; text-align: center;}
        .rank-title { font-size: 2rem; font-weight: 900; font-style: italic; }
        .animal-icon { font-size: 6rem; }
        .student-name { font-size: 2.5rem; font-weight: 900; word-break: break-all; }
        .student-no { font-size: 1.2rem; opacity: 0.8; }

        /* 特效控制 */
        .style-ur { background: #000; animation: ur-glow 2s infinite alternate; }
        .style-ssr { background: #2d1b00; border-color: var(--ssr); box-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .style-custom { background: #075985; border-color: #0ea5e9; box-shadow: 0 0 30px rgba(14, 165, 233, 0.4); }
        @keyframes ur-glow { 0% { box-shadow: 0 0 30px #ff0000; } 100% { box-shadow: 0 0 60px #00ffd5; } }

        /* 控制面板 */
        .control-panel { 
            background: rgba(255,255,255,0.05); padding: 15px 40px; border-radius: 50px; 
            display: flex; gap: 25px; align-items: center; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }
        .btn-summon {
            background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
            border: none; color: white; padding: 12px 40px; font-size: 1.5rem;
            border-radius: 30px; cursor: pointer; font-weight: 900; transition: 0.3s;
        }
        .btn-summon:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.1); }

        /* --- 設定介面 --- */
        #setup-view { gap: 20px; }
        .left-col { width: 320px; display: flex; flex-direction: column; gap: 10px; }
        textarea { height: 120px; background: #0a0a0a; color: #4ade80; border: 2px solid #334155; border-radius: 10px; padding: 10px; }
        .waiting-room { background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px; flex: 1; overflow-y: auto; border: 2px solid #1e293b; }
        
        .student-chip {
            background: #334155; padding: 6px 14px; border-radius: 20px; margin: 4px;
            cursor: grab; display: inline-block; font-size: 0.95rem; font-weight: bold; border: 2px solid transparent;
        }
        .student-chip.drawn { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }
        .student-chip.active-drag { opacity: 0.5; }

        .right-col { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .zone { background: rgba(0,0,0,0.7); border: 2px solid #334155; border-radius: 15px; display: flex; flex-direction: column; padding: 10px; cursor: pointer; transition: 0.2s; }
        .zone.active-target { border-color: #fff; background: rgba(255,255,255,0.1); }
        .zone-c { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; min-height: 50px; }

        /* --- 萬物召喚介面 --- */
        .custom-input-area { width: 400px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

        .screen-shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% {transform:translate(0,0)} 25% {transform:translate(-5px,5px)} 50% {transform:translate(5px,-5px)} 75% {transform:translate(-5px,-5px)} }

        .notice { position: fixed; bottom: 20px; right: 20px; background: #4f46e5; padding: 10px 20px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="vortex"></div>

<div class="top-nav">
    <div style="font-size: 1.5rem; font-weight: 900; background: var(--ur); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">⚡ SACRED SUMMON 大師版</div>
    <div style="display: flex; gap: 10px;">
        <button onclick="switchView('draw')" style="background:#4f46e5; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">👤 學生召喚</button>
        <button onclick="switchView('custom')" style="background:#0891b2; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">📦 萬物召喚</button>
        <button onclick="switchView('setup')" style="background:#334155; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">⚙️ 設定</button>
    </div>
</div>

<div id="draw-view" class="view active">
    <div class="control-panel">
        <div>
            人數：<input type="number" id="draw-count" value="1" min="1" max="10" style="width:40px; background:#000; color:#fff; border:1px solid #555; padding:5px;">
        </div>
        <label>
            <input type="checkbox" id="no-repeat" checked> 不重複抽選
        </label>
        <span id="stats-text" style="color:#ffd700; font-weight:bold;">已抽: 0/0</span>
        <button onclick="resetDrawn()" style="background:none; border:1px solid #888; color:#ccc; padding:2px 10px; cursor:pointer; font-size:0.8rem; border-radius:4px;">重置進度</button>
    </div>
    <div class="summon-stage" id="summon-stage"></div>
    <button class="btn-summon" id="btn-draw" onclick="executeSummon()">✨ 進行召喚</button>
</div>

<div id="custom-view" class="view">
    <div class="custom-input-area">
        <h3 style="margin:0">萬物召喚清單 (每行一個項目)</h3>
        <textarea id="custom-items" placeholder="獎勵：五顆糖果&#10;處罰：擦黑板&#10;項目：多喝水"></textarea>
    </div>
    <div class="summon-stage" id="custom-stage"></div>
    <button class="btn-summon" style="background:linear-gradient(135deg, #0ea5e9, #2563eb);" onclick="executeCustomSummon()">📦 隨機抽取</button>
</div>

<div id="setup-view" class="view">
    <div class="left-col">
        <textarea id="import-area" placeholder="貼入名單 (01. 姓名)"></textarea>
        <button onclick="processImport()" style="padding:10px; background:#10b981; border:none; color:white; border-radius:5px; cursor:pointer; font-weight:bold;">⚡ 匯入名單</button>
        <div class="waiting-room" id="zone-null" ondrop="drop(event, 'null')" ondragover="allowDrop(event)" onclick="selectZone('null')">
            <h4 style="margin:0 0 10px 0;">⏳ 候選池</h4>
            <div id="pool-content" class="zone-c"></div>
        </div>
        <button onclick="clearData()" style="padding:5px; background:rgba(255,0,0,0.3); border:none; color:white; border-radius:5px; cursor:pointer;">🗑️ 清空數據</button>
    </div>
    <div class="right-col">
        <div class="zone" id="zone-UR" ondrop="drop(event, 'UR')" ondragover="allowDrop(event)" onclick="selectZone('UR')" style="border-color:#ff00c8"><div class="zone-h" style="color:#ff00c8">✦ UR ✦</div><div class="zone-c"></div></div>
        <div class="zone" id="zone-SSR" ondrop="drop(event, 'SSR')" ondragover="allowDrop(event)" onclick="selectZone('SSR')" style="border-color:var(--ssr)"><div class="zone-h" style="color:var(--ssr)">✦ SSR ✦</div><div class="zone-c"></div></div>
        <div class="zone" id="zone-SR" ondrop="drop(event, 'SR')" ondragover="allowDrop(event)" onclick="selectZone('SR')" style="border-color:var(--sr)"><div class="zone-h" style="color:var(--sr)">✦ SR ✦</div><div class="zone-c"></div></div>
        <div class="zone" id="zone-S" ondrop="drop(event, 'S')" ondragover="allowDrop(event)" onclick="selectZone('S')" style="border-color:var(--s)"><div class="zone-h" style="color:var(--s)">✦ S ✦</div><div class="zone-c"></div></div>
        <div class="zone" id="zone-R" ondrop="drop(event, 'R')" ondragover="allowDrop(event)" onclick="selectZone('R')" style="border-color:var(--r)"><div class="zone-h" style="color:var(--r)">✦ R ✦</div><div class="zone-c"></div></div>
        <div class="zone" id="zone-N" ondrop="drop(event, 'N')" ondragover="allowDrop(event)" onclick="selectZone('N')" style="border-color:var(--n)"><div class="zone-h" style="color:var(--n)">✦ N ✦</div><div class="zone-c"></div></div>
    </div>
</div>

<audio id="sfx-summon" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="sfx-reveal" src="https://assets.mixkit.co/active_storage/sfx/1484/1484-preview.mp3"></audio>

<script>
    let studentData = JSON.parse(localStorage.getItem('master_gacha_v7')) || [];
    let currentSelectedZone = null;

    window.onload = () => { renderAll(); updateStats(); };

    function switchView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(name + '-view').classList.add('active');
    }

    function saveData() { localStorage.setItem('master_gacha_v7', JSON.stringify(studentData)); }

    // --- 設定與拖曳邏輯 ---
    function processImport() {
        const text = document.getElementById('import-area').value;
        if(!text.trim()) return;
        text.split('\n').forEach((line, index) => {
            if(!line.trim()) return;
            const match = line.match(/(\d+)[\.\s]+(.+)/);
            studentData.push({ 
                id: 'std-' + Date.now() + Math.random(), 
                no: match ? match[1] : (index + 1), 
                name: match ? match[2].trim() : line.trim(), 
                rank: null, drawn: false 
            });
        });
        document.getElementById('import-area').value = "";
        saveData(); renderAll(); updateStats();
    }

    function allowDrop(e) { e.preventDefault(); }
    function drag(e, id) { e.dataTransfer.setData("text", id); }

    function drop(e, rank) {
        e.preventDefault();
        const id = e.dataTransfer.getData("text");
        const s = studentData.find(x => x.id === id);
        if (s) { s.rank = rank === 'null' ? null : rank; saveData(); renderAll(); updateStats(); }
    }

    function selectZone(rank) {
        currentSelectedZone = rank === 'null' ? null : rank;
        document.querySelectorAll('.zone, .waiting-room').forEach(z => z.classList.remove('active-target'));
        document.getElementById(rank === 'null' ? 'zone-null' : `zone-${rank}`).classList.add('active-target');
    }

    function moveStudent(id) {
        const s = studentData.find(x => x.id === id);
        if (s) { s.rank = currentSelectedZone; saveData(); renderAll(); updateStats(); }
    }

    function renderAll() {
        document.getElementById('pool-content').innerHTML = '';
        document.querySelectorAll('.zone-c').forEach(c => c.innerHTML = '');
        studentData.forEach(s => {
            const chip = document.createElement('div');
            chip.className = `student-chip ${s.drawn ? 'drawn' : ''}`;
            chip.innerText = `${s.no}. ${s.name}`;
            chip.draggable = true;
            chip.ondragstart = (e) => drag(e, s.id);
            chip.onclick = (e) => { e.stopPropagation(); if(!s.drawn) moveStudent(s.id); };
            if (!s.rank) document.getElementById('pool-content').appendChild(chip);
            else { const target = document.querySelector(`#zone-${s.rank} .zone-c`); if (target) target.appendChild(chip); }
        });
    }

    function updateStats() {
        const active = studentData.filter(s => s.rank !== null);
        const drawnCount = active.filter(s => s.drawn).length;
        document.getElementById('stats-text').innerText = `已抽: ${drawnCount} / ${active.length}`;
        document.getElementById('btn-draw').disabled = (active.length > 0 && drawnCount === active.length && document.getElementById('no-repeat').checked);
    }

    function resetDrawn() { studentData.forEach(s => s.drawn = false); saveData(); renderAll(); updateStats(); }
    function clearData() { if(confirm("確定清空？")) { studentData = []; saveData(); renderAll(); updateStats(); } }

    // --- 召喚核心 ---
    const animals = { UR: '🐉', SSR: '🦁', SR: '🦅', S: '🦌', R: '🐈', N: '🐭' };

    async function executeSummon() {
        const isNoRepeat = document.getElementById('no-repeat').checked;
        let pool = studentData.filter(s => s.rank !== null && (!isNoRepeat || !s.drawn));
        
        if(pool.length === 0) return alert("沒有可抽的對象！");

        const count = Math.min(parseInt(document.getElementById('draw-count').value), pool.length);
        const stage = document.getElementById('summon-stage');
        stage.innerHTML = '';
        document.getElementById('sfx-summon').play();

        let winners = [];
        for(let i=0; i<count; i++) {
            const idx = Math.floor(Math.random() * pool.length);
            winners.push(pool.splice(idx, 1)[0]);
        }

        for(let winner of winners) {
            const card = createCard(winner.rank, winner.name, `座號：${winner.no}`, animals[winner.rank]);
            stage.appendChild(card);
            await new Promise(r => setTimeout(r, 400));
            card.classList.add('flipped');
            document.body.classList.add('screen-shake');
            document.getElementById('sfx-reveal').currentTime = 0;
            document.getElementById('sfx-reveal').play();
            winner.drawn = true;
            setTimeout(() => document.body.classList.remove('screen-shake'), 200);
        }
        saveData(); updateStats();
    }

    // --- 萬物召喚核心 ---
    async function executeCustomSummon() {
        const raw = document.getElementById('custom-items').value.split('\n').filter(t => t.trim() !== '');
        if(raw.length === 0) return alert("請輸入項目！");

        const stage = document.getElementById('custom-stage');
        stage.innerHTML = '';
        document.getElementById('sfx-summon').play();

        const item = raw[Math.floor(Math.random() * raw.length)];
        const card = createCard('Custom', item, '萬物召喚', '🎁');
        stage.appendChild(card);
        
        await new Promise(r => setTimeout(r, 800));
        card.classList.add('flipped');
        document.body.classList.add('screen-shake');
        document.getElementById('sfx-reveal').play();
        setTimeout(() => document.body.classList.remove('screen-shake'), 200);
    }

    function createCard(rank, name, sub, icon) {
        const div = document.createElement('div');
        div.className = 'big-card';
        div.innerHTML = `
            <div class="card-face card-back"></div>
            <div class="card-face card-front style-${rank.toLowerCase()}">
                <div class="rank-title" style="color:var(--${rank.toLowerCase()})">${rank === 'Custom' ? 'ITEM' : rank}</div>
                <div class="animal-icon">${icon}</div>
                <div class="student-name" style="${name.length > 5 ? 'font-size:1.5rem' : ''}">${name}</div>
                <div class="student-no">${sub}</div>
            </div>
        `;
        return div;
    }
</script>

</body>
</html>
